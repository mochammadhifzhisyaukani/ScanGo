# Salin ke /etc/nginx/sites-available/scango
# sudo ln -s /etc/nginx/sites-available/scango /etc/nginx/sites-enabled/scango
# sudo nginx -t && sudo systemctl reload nginx
# HTTPS: sudo certbot --nginx -d scango.smkwikrama.sch.id
server {
    listen 80;
    listen [::]:80;
    server_name scango.smkwikrama.sch.id;

    root /var/www/scango.smkwikrama.sch.id;
    index index.html;

    client_max_body_size 2m;

    # Halaman utama
    location = / {
        try_files /index.html =404;
    }
    location = /index.html { }

    # Asset & halaman frontend (statis)
    location /frontEnd/ {
        try_files $uri =404;
        location ~* \.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    # API & dokumentasi -> Node (systemd: scango.service)
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /api-docs {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /openapi.yaml {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
    }

    # Selain di atas TIDAK boleh diakses (.env, .git, backend/, node_modules/, dll.)
    location / {
        return 404;
    }
}
