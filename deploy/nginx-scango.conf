# Salin ke /etc/nginx/sites-available/scango
# sudo ln -s /etc/nginx/sites-available/scango /etc/nginx/sites-enabled/scango
# sudo nginx -t && sudo systemctl reload nginx
#
# Reverse proxy (Nginx Proxy Manager) meneruskan ke http://172.16.10.25:80 (sama seperti sidata),
# jadi port 80 TIDAK boleh redirect ke https (bisa loop). HTTPS ditangani proxy/Cloudflare.
# Port 443 tetap disediakan dengan sertifikat sidata-local, seperti situs lain di server ini.

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name scango.smkwikrama.sch.id;

    ssl_certificate     /etc/ssl/certs/sidata-local.crt;
    ssl_certificate_key /etc/ssl/private/sidata-local.key;

    root /var/www/scango.smkwikrama.sch.id;
    index index.html;

    client_max_body_size 2m;

    # Halaman utama
    location = / {
        try_files /index.html =404;
    }
    location = /index.html { }

    # Asset & halaman frontend (statis)
    location /frontEnd/ {
        try_files $uri =404;
        location ~* \.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public";
        }
    }

    # API & dokumentasi -> Node (systemd: scango.service)
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
    location = /api-docs {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /openapi.yaml {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
    }

    # Selain di atas TIDAK boleh diakses (.env, .git, backend/, node_modules/, dll.)
    location / {
        return 404;
    }
}
