<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Traffic Tap Kartu & Analisis Jam Puncak | ScanGo</title>
    <link rel="icon" type="image/png" href="/frontEnd/assets/logo/favicon.png?v20260807" />

    <!-- CSS Global -->
    <link rel="stylesheet" href="/frontEnd/style/global.css?v20260807" />
    <!-- CSS Statistika (untuk shell layout sidebar/header) -->
    <link rel="stylesheet" href="/frontEnd/style/statistika.css?v20260807" />
    <!-- CSS Traffic Khusus -->
    <link rel="stylesheet" href="/frontEnd/style/traffic.css?v20261118" />
    <!-- CSS Component Change Theme -->
    <link rel="stylesheet" href="/frontEnd/style/components/changeTheme.css" />

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        crossorigin="anonymous" />

    <!-- Font Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>

<body class="statistika-page traffic-page">

    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar d-none d-md-flex">
            <div class="sidebar-logo">
                <div onclick="navigateTo('dashboard')" role="button" title="ScanGo Home">
                    <img src="/frontEnd/assets/logo/favicon.png?v20260807" style="height: 30px;" alt="Logo ScanGo">
                </div>
            </div>
            <div class="sidebar-menu">
                <div class="menu-icon" onclick="navigateTo('dashboard')" title="Dashboard Absensi">
                    <i class="bi bi-house-door"></i>
                </div>

                <div class="menu-icon" onclick="navigateTo('print')" title="Cetak Data">
                    <i class="bi bi-printer"></i>
                </div>

                <div class="menu-icon" onclick="navigateTo('grafik')" title="Statistika & Grafik">
                    <i class="bi bi-bar-chart-line"></i>
                </div>

                <div class="menu-icon active" onclick="navigateTo('traffic')" title="Traffic Tap Kartu & Jam Puncak">
                    <i class="bi bi-broadcast"></i>
                </div>

                <div class="menu-icon" onclick="navigateTo('input-siswa')" title="Data Siswa">
                    <i class="bi bi-person-fill-add"></i>
                </div>

                <div class="menu-icon" style="margin-top: auto;" data-bs-toggle="modal" data-bs-target="#modalTheme" title="Pengaturan Tema">
                    <i class="bi bi-gear"></i>
                </div>

                <div class="menu-icon"
                    onclick="if(confirm('Yakin ingin keluar dari dashboard?')){ sessionStorage.removeItem('token'); sessionStorage.removeItem('role'); sessionStorage.removeItem('username'); fetch(API_BASE + '/api/auth/logout', { method: 'POST', credentials: 'include' }).finally(function(){ window.location.href='/index.html'; }); }" title="Keluar">
                    <i class="bi bi-box-arrow-left text-danger"></i>
                </div>

                <!-- Modal Pengaturan Tema -->
                <div class="modal fade" id="modalTheme" tabindex="-1" aria-labelledby="modalThemeLabel"
                    aria-hidden="true" data-bs-append-to-body="true">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h1 class="modal-title fs-5" id="modalThemeLabel">Pengaturan Tampilan</h1>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <span>Ubah Tema Tampilan</span>
                                <div id="changeTheme2" class="mt-2"></div>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Wrapper -->
        <div class="main-wrapper mt-4" style="flex: 1; display: flex; flex-direction: column;">

            <!-- Header Panel -->
            <header class="header-panel animate__animated animate__fadeIn pe-4 d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-2">
                    <button id="sidebarToggleBtn" class="btn btn-light ms-3" type="button"
                        aria-controls="mobileMenu" aria-label="Buka menu navigasi">
                        <i class="bi bi-list fs-3"></i>
                    </button>
                    <div class="header-title">
                        <h4 class="ms-2 ms-md-3 mb-0" style="color: var(--color-teks);">
                            <i class="bi bi-broadcast text-primary me-2"></i>Traffic Tap Kartu RFID
                        </h4>
                    </div>
                </div>
                <div class="d-flex align-items-center gap-3">
                    <div class="clock-date-wrapper me-3 text-end">
                        <p id="time" class="mb-0 fw-bold"></p>
                        <p id="date" class="mb-0 text-muted small"></p>
                    </div>
                </div>
            </header>

            <!-- Mount Content -->
            <main id="content">
                <!-- Diisi secara dinamis oleh renderTraffic() -->
            </main>

        </div>
    </div>

    <!-- Mobile Offcanvas Menu -->
    <div class="offcanvas offcanvas-bottom rounded-top-4" tabindex="-1" id="mobileMenu"
        aria-labelledby="mobileMenuLabel" style="height: auto; max-height: 80vh;">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title" id="mobileMenuLabel">Menu Navigasi</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <div class="row g-4 text-center">
                <div class="col-4" onclick="navigateTo('dashboard')" data-bs-dismiss="offcanvas">
                    <div class="p-3 bg-light rounded-3">
                        <i class="bi bi-house-door fs-3 text-secondary"></i>
                        <div class="small mt-1">Home</div>
                    </div>
                </div>
                <div class="col-4" onclick="navigateTo('print')" data-bs-dismiss="offcanvas">
                    <div class="p-3 bg-light rounded-3">
                        <i class="bi bi-printer fs-3 text-secondary"></i>
                        <div class="small mt-1">Cetak</div>
                    </div>
                </div>
                <div class="col-4" onclick="navigateTo('grafik')" data-bs-dismiss="offcanvas">
                    <div class="p-3 bg-light rounded-3">
                        <i class="bi bi-bar-chart-line fs-3 text-secondary"></i>
                        <div class="small mt-1">Grafik</div>
                    </div>
                </div>
                <div class="col-4" onclick="navigateTo('traffic')" data-bs-dismiss="offcanvas">
                    <div class="p-3 bg-light rounded-3 text-primary border border-primary">
                        <i class="bi bi-broadcast fs-3 text-primary"></i>
                        <div class="small mt-1 fw-bold">Traffic Tap</div>
                    </div>
                </div>
                <div class="col-4" onclick="navigateTo('input-siswa')" data-bs-dismiss="offcanvas">
                    <div class="p-3 bg-light rounded-3">
                        <i class="bi bi-person-fill-add fs-3 text-secondary"></i>
                        <div class="small mt-1">Siswa</div>
                    </div>
                </div>
                <div class="col-4" data-bs-toggle="modal" data-bs-target="#modalTheme" data-bs-dismiss="offcanvas">
                    <div class="p-3 bg-light rounded-3">
                        <i class="bi bi-gear fs-3 text-secondary"></i>
                        <div class="small mt-1">Tema</div>
                    </div>
                </div>
                <div class="col-12 text-center"
                    onclick="if(confirm('Yakin ingin keluar?')){ sessionStorage.removeItem('token'); sessionStorage.removeItem('role'); sessionStorage.removeItem('username'); fetch(API_BASE + '/api/auth/logout', { method: 'POST', credentials: 'include' }).finally(function(){ window.location.href='/index.html'; }); }">
                    <div class="p-3 bg-light rounded-3 text-danger">
                        <i class="bi bi-box-arrow-left fs-3"></i>
                        <div class="small mt-1 fw-bold">Keluar Akun</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Auth Helper Token Interceptor -->
    <script>
        (function () {
            const origFetch = window.fetch;
            window.fetch = function (url, options) {
                options = options || {};
                options.headers = options.headers || {};
                options.credentials = options.credentials || "include";
                const token = sessionStorage.getItem("token");
                if (token && !options.headers["Authorization"]) {
                    options.headers["Authorization"] = "Bearer " + token;
                }
                return origFetch.call(this, url, options);
            };
        })();
    </script>

    <!-- App Configuration -->
    <script src="/frontEnd/config.js?v20260807"></script>
    <!-- Change Theme Engine -->
    <script src="/frontEnd/components/changetheme.js?v20260807"></script>
    <!-- View Controller Traffic -->
    <script src="/frontEnd/page/content/views/traffic.js?v20261118"></script>
    <!-- Single Page Router -->
    <script src="/frontEnd/components/router.js?v20260807"></script>
    <!-- Sidebar Toggle -->
    <script src="/frontEnd/components/dashboard/sidebarToggle.js?v20260812"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
</body>

</html>
